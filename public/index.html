<style>
/* Layout: one full-bleed oil-painted view across the Mark toward Kasteel Bouvigne; name sits in the sky, drawing hint at the bottom, you draw on the meadow */
:root{
  --sky:#5d9fd1;
  --cream:#fdf8ec;
  --ink:#2a2620;
  --paper:#fffaf0;
  --wool:#fbf6ea;
  --wool-shade:#e9dfcc;
  --wool-ink:#3b3128;
  --meadow:#5f9e37;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --hand:"Gaegu", "Comic Sans MS", "Chalkboard SE", cursive;
  --ui:"Figtree", system-ui, -apple-system, sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{
  background:var(--sky);color:var(--ink);font-family:var(--ui);
  overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
#gl,#ink{position:fixed;inset:0;width:100%;height:100%;display:block}
#ink{touch-action:none;cursor:crosshair}
.title{
  position:fixed;pointer-events:none;color:var(--cream);
  top:calc(env(safe-area-inset-top,0px) + 16px);
  left:max(20px,calc(env(safe-area-inset-left,0px) + 20px));
  text-shadow:0 1px 2px rgba(20,40,60,.35),0 0 18px rgba(20,50,80,.25);
}
.title h1{margin:0;font:400 clamp(34px,9vw,52px)/1 var(--display);letter-spacing:-.01em}
.title h1 span{font:600 .3em/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;vertical-align:.95em;margin-left:.45em;opacity:.85}
.title p{position:relative;left:0;transform:none;margin:12px 0 0 6px;display:inline-flex;padding:7px 16px 7px 10px;font-size:19px;text-shadow:none}
.title b{font-variant-numeric:tabular-nums}
.pill{
  position:fixed;left:50%;transform:translateX(-50%);isolation:isolate;
  display:flex;align-items:center;gap:8px;white-space:nowrap;pointer-events:none;
  background:transparent;color:var(--wool-ink);padding:11px 20px 11px 16px;
  font:700 21px/1 var(--hand);
  filter:drop-shadow(0 2px 0 rgba(120,100,70,.35)) drop-shadow(0 8px 14px rgba(30,40,20,.28));
  transition:opacity .35s ease, transform .35s ease;
}
.pill .fleece{position:absolute;z-index:-1;left:-8px;top:-8px;overflow:visible;pointer-events:none}
.pill > svg:not(.fleece){width:24px;height:24px;flex:none}
#hint,#shareBtn{bottom:calc(env(safe-area-inset-bottom,0px) + 22px)}
.hint{width:max-content;max-width:calc(100vw - 56px)}
.hint span{display:flex;flex-direction:column;gap:3px;white-space:normal}
.hint b{font-weight:700;font-size:20px;line-height:1.05}
.hint small{font:400 16px/1.15 var(--hand)}
.round{left:auto;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));top:calc(env(safe-area-inset-top,0px) + 22px);bottom:auto;transform:none;padding:9px}
.round.armed{color:#9a3b22}
.round.info{right:max(80px,calc(env(safe-area-inset-right,0px) + 80px))}
.btn.round:active{transform:scale(.92)}
.btn{pointer-events:auto;cursor:pointer;border:0;font-size:18px;padding:9px 16px 9px 12px}
.btn > svg:not(.fleece){width:20px !important;height:20px !important}
.btn:active{transform:translateX(-50%) scale(.95)}
.stats{margin:8px 0 0 10px;font:700 16px/1.2 var(--hand);text-shadow:0 1px 2px rgba(20,40,60,.7),0 0 10px rgba(20,50,80,.55)}
#toast{bottom:calc(env(safe-area-inset-bottom,0px) + 76px);opacity:0;transform:translate(-50%,8px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#loading{top:50%;transform:translate(-50%,-50%)}
#loading[hidden]{display:none}
@media (prefers-reduced-motion: reduce){ .pill{transition:none} }
</style>

  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5A1.5 1.5 0 015.5 7h2.2l1.4-2h5.8l1.4 2h2.2A1.5 1.5 0 0120 8.5v9a1.5 1.5 0 01-1.5 1.5h-13A1.5 1.5 0 014 17.5z" fill="none" stroke="#3b3128" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="12.8" r="3.3" fill="none" stroke="#3b3128" stroke-width="1.7"/></svg>
  Deel je wei
</button>

<script src="vendor/three.min.js"></script>
<script>
(() => {
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
const lerp = (a,b,t) => a + (b-a)*t;
const sstep = (a,b,v) => { const t = clamp((v-a)/(b-a),0,1); return t*t*(3-2*t); };
function rng(seed){ let s = (seed * 2654435761) >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
function makeNoise(seed){
  const r = rng(seed), v = new Float32Array(65536); for(let i=0;i<65536;i++) v[i] = r();
  return (x,y) => { const xi = Math.floor(x), yi = Math.floor(y), xf = x-xi, yf = y-yi;
    const a = v[((yi&255)<<8)|(xi&255)], b = v[((yi&255)<<8)|((xi+1)&255)], c = v[(((yi+1)&255)<<8)|(xi&255)], d = v[(((yi+1)&255)<<8)|((xi+1)&255)];
    const u = xf*xf*(3-2*xf), w = yf*yf*(3-2*yf); return a + (b-a)*u + (c-a)*w + (a-b-c+d)*u*w; };
}
const N1 = makeNoise(1), N2 = makeNoise(2), N3 = makeNoise(3);
const fbm = (x,y) => N1(x,y)*.5 + N2(x*2.13,y*2.13)*.3 + N3(x*4.37,y*4.37)*.2;
const HEX = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
const mixc = (a,b,t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
const css = (c,j=0) => `rgb(${clamp(c[0]+j,0,255)|0},${clamp(c[1]+j,0,255)|0},${clamp(c[2]+j*.8,0,255)|0})`;
const canvas = (w,h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

/* =========================================================
   The place, in metres. x = right (north), z = toward the viewer (east).
   The viewer floats ~30 m above the east bank of the Mark and looks west,
   across the river and the Bieberglaan, to Kasteel Bouvigne and the Mastbos.
   ========================================================= */
const CAM = new THREE.Vector3(4, 16, 0), LOOK = new THREE.Vector3(-4, 0, -90);
const MARK = [[-340,-70],[-160,-64],[-110,-62],[-70,-66],[-40,-74],[-20,-68],[-4,-60],[12,-62],[26,-72],[40,-84],[60,-88],[90,-82],[130,-74],[200,-78],[340,-80]];
function cr(P, x){
  let i = 1; while(i < P.length-3 && P[i+1][0] < x) i++;
  const p0 = P[i-1], p1 = P[i], p2 = P[i+1], p3 = P[i+2];
  const t = clamp((x-p1[0])/(p2[0]-p1[0]),0,1), t2 = t*t, t3 = t2*t;
  return .5*((2*p1[1]) + (-p0[1]+p2[1])*t + (2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2 + (-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3);
}
const riverZ = x => cr(MARK, x);
const halfW = x => 4.6 + .7*Math.sin(x*.07);
const riverD = (x,z) => { const s = (riverZ(x+1)-riverZ(x-1))/2; return Math.abs(z-riverZ(x))/Math.sqrt(1+s*s); };
const pathZ = x => riverZ(x) - 38 + 3*Math.sin(x*.03);
const fenceZ = x => riverZ(x) + halfW(x) + 5;
// Kasteel Bouvigne: ~16 x 13 m house with a slender corner tower, wholly moated
const CX = -16, CZ = -196, ROT = -.12, cR = Math.cos(ROT), sR = Math.sin(ROT);
const toLocal = (x,z) => { const dx = x-CX, dz = z-CZ; return [dx*cR - dz*sR, dx*sR + dz*cR]; };
const toWorld = (lx,lz) => [CX + lx*cR + lz*sR, CZ - lx*sR + lz*cR];
const GARDEN = [30,-178], WY = .12;
// the house stands straight in a wide pond; a long low bridge leaves its south side
const pondE = (lx,lz) => Math.pow(Math.abs((lx+2)/30),3.2) + Math.pow(Math.abs((lz+2)/30),3.2) + (N1(lx*.07+40, lz*.07)-.5)*.3;
const inPond = (x,z) => { const [lx,lz] = toLocal(x,z); return pondE(lx,lz) < 1; };
const inEstate = (x,z) => { const [lx,lz] = toLocal(x,z); return (lx > -48 && lx < 36 && lz > -42 && lz < 36) || Math.hypot(x-GARDEN[0], z-GARDEN[1]) < 17; };
const SUN = new THREE.Vector3(-.7, .55, .25).normalize();

/* =========================================================
   Painted textures
   ========================================================= */
function groundAt(x,z){
  const n = fbm(x*.022+3, z*.022), m = fbm(x*.09+11, z*.09+4), k = N3(x*.35, z*.35);
  let c = mixc(HEX('#4a7c34'), HEX('#83ad3f'), sstep(.28,.62,n));
  c = mixc(c, HEX('#bccf55'), sstep(.52,.78,m)*.65);
  c = mixc(c, HEX('#3d6a3a'), sstep(.62,.85,1-m)*.35);
  c = mixc(c, mixc(c, HEX('#d7d76a'), .5), (k-.5)*.25+.0);
  const p = N2(x*.05+7, z*.07+2);
  c = mixc(c, HEX('#cfd86c'), sstep(.6,.85,p)*.45);
  c = mixc(c, HEX('#2f5a35'), sstep(.62,.9,N1(x*.06+20, z*.06))*.3);
  // estate lawns are kept shorter and lighter
  const [lx,lz] = toLocal(x,z);
  const e2 = Math.max(Math.abs((lx+4)/56), Math.abs(lz/48));
  if(e2 < 1) c = mixc(c, HEX('#93c159'), .42*sstep(1,.7,e2));
  // round parterre
  const gd = Math.hypot(x-GARDEN[0], z-GARDEN[1]);
  if(gd < 15.5){ const ring = (gd > 12 && gd < 14) || (gd > 7 && gd < 9) || gd < 2.6 || Math.abs((x-GARDEN[0])-(z-GARDEN[1])) < 1.1 || Math.abs((x-GARDEN[0])+(z-GARDEN[1])) < 1.1; c = ring ? HEX('#ddcfa8') : HEX('#8fbd56'); }
  // the pond and its muddy rim, and the gravel lane from the gatehouse
  const pe = pondE(lx,lz);
  if(pe < 1.2) c = pe < 1 ? HEX('#33433a') : mixc(HEX('#76694a'), c, sstep(1,1.2,pe));
  if(lx < -33 && lx > -60 && Math.abs(lz) < 1.8) c = HEX('#d6c79f');
  // Bieberglaan, a sandy lane
  const pd = Math.abs(z - pathZ(x));
  if(pd < 2.2) c = mixc(HEX('#d9c38b'), c, sstep(1.4,2.2,pd));
  // the Mark: dark bed, wet mud, then a sandy lip into the grass
  const rd = riverD(x,z), hw = halfW(x);
  if(rd < hw + 1.6){
    const t = (rd-hw)/1.6;
    c = rd < hw ? HEX('#3a4634') : mixc(mixc(HEX('#6b6447'), HEX('#b09a69'), sstep(0,.45,t)), c, sstep(.45,1,t));
  }
  return c;
}

function paintGround(W, H, rect, near){
  const c = canvas(W,H), g = c.getContext('2d'), r = rng(near ? 21 : 22);
  const mx = px => rect.x0 + px/W*(rect.x1-rect.x0), mz = py => rect.z0 + py/H*(rect.z1-rect.z0);
  // underpainting
  const lw = W>>2, lh = H>>2, small = canvas(lw,lh), sg = small.getContext('2d'), img = sg.createImageData(lw,lh);
  for(let j=0;j<lh;j++) for(let i=0;i<lw;i++){ const col = groundAt(mx((i+.5)*4), mz((j+.5)*4)), o = (j*lw+i)*4; img.data[o] = col[0]; img.data[o+1] = col[1]; img.data[o+2] = col[2]; img.data[o+3] = 255; }
  sg.putImageData(img,0,0); g.imageSmoothingEnabled = true; g.drawImage(small,0,0,W,H);
  // brushwork
  const count = W*H/(near ? 58 : 85);
  for(let i=0;i<count;i++){
    const px = r()*W, py = r()*H, col = groundAt(mx(px), mz(py)), s = (near ? 2.2 : 1.8) + r()*(near ? 5 : 3.5);
    g.fillStyle = css(col, (r()-.5)*34); g.globalAlpha = .55 + r()*.45;
    g.beginPath(); g.ellipse(px, py, s*(1.6+r()*1.6), s*.7, (r()-.5)*.5, 0, 6.283); g.fill();
  }
  g.globalAlpha = 1;
  if(near){
    // grass blades
    g.lineCap = 'round';
    for(let i=0;i<9000;i++){
      const px = r()*W, py = r()*H, x = mx(px), z = mz(py);
      if(riverD(x,z) < halfW(x)+1.2 || Math.abs(z-pathZ(x)) < 2) continue;
      const col = groundAt(x,z), l = 4+r()*7;
      g.strokeStyle = css(col, r() < .5 ? -40 : 34); g.lineWidth = 1+r()*1.2; g.globalAlpha = .7;
      g.beginPath(); g.moveTo(px,py); g.quadraticCurveTo(px+(r()-.5)*4, py-l*.6, px+(r()-.5)*5, py-l); g.stroke();
    }
    // buttercups, daisies and a little lady's smock
    for(let k=0;k<260;k++){
      const cx = r()*W, cy = r()*H; if(riverD(mx(cx),mz(cy)) < halfW(mx(cx))+2) continue;
      const rad = 10+r()*40, kind = r();
      for(let i=0;i<26;i++){
        const a = r()*6.283, d = Math.sqrt(r())*rad;
        g.fillStyle = kind < .6 ? (r()<.8 ? '#f4d24a' : '#e8a93a') : kind < .9 ? '#fbf6e8' : '#c7a4d8';
        g.globalAlpha = .9; g.beginPath(); g.arc(cx+Math.cos(a)*d, cy+Math.sin(a)*d*.8, 1.6+r()*1.8, 0, 6.283); g.fill();
      }
    }
    // grass leaning over the river banks
    for(let x=rect.x0; x<rect.x1; x+=.12){
      [-1,1].forEach(s => {
        const z = riverZ(x) + s*(halfW(x)+.15+r()*.5), px = (x-rect.x0)/(rect.x1-rect.x0)*W, py = (z-rect.z0)/(rect.z1-rect.z0)*H, l = 6+r()*12;
        g.strokeStyle = r() < .5 ? '#3f6b2f' : '#8fb24a'; g.lineWidth = 1.5+r()*1.5; g.globalAlpha = .9;
        g.beginPath(); g.moveTo(px,py); g.lineTo(px+(r()-.5)*6, py - s*l); g.stroke();
      });
    }
    g.globalAlpha = 1;
    // soften the edges so the near canvas melts into the far one
    g.globalCompositeOperation = 'destination-in';
    const fx = g.createLinearGradient(0,0,W,0); fx.addColorStop(0,'rgba(0,0,0,0)'); fx.addColorStop(.05,'#000'); fx.addColorStop(.95,'#000'); fx.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle = fx; g.fillRect(0,0,W,H);
    const fz = g.createLinearGradient(0,0,0,H); fz.addColorStop(0,'rgba(0,0,0,0)'); fz.addColorStop(.06,'#000'); fz.addColorStop(1,'#000');
    g.fillStyle = fz; g.fillRect(0,0,W,H);
    g.globalCompositeOperation = 'source-over';
  } else {
    const px0 = Math.max(0, Math.floor((-75-rect.x0)/(rect.x1-rect.x0)*W)), px1 = Math.min(W, Math.ceil((30-rect.x0)/(rect.x1-rect.x0)*W));
    const py0 = Math.max(0, Math.floor((-250-rect.z0)/(rect.z1-rect.z0)*H)), py1 = Math.min(H, Math.ceil((-145-rect.z0)/(rect.z1-rect.z0)*H));
    const im = g.getImageData(px0, py0, px1-px0, py1-py0);
    for(let j=0;j<py1-py0;j++) for(let i=0;i<px1-px0;i++) if(inPond(mx(px0+i+.5), mz(py0+j+.5))) im.data[(j*(px1-px0)+i)*4+3] = 0;
    g.putImageData(im, px0, py0);
  }
  return c;
}

function leafTexture(willow){
  const c = canvas(256,256), g = c.getContext('2d'), r = rng(willow ? 7 : 3);
  for(let i=0;i<(willow ? 80 : 54);i++){
    const a = r()*6.283, d = Math.pow(r(),.55)*(willow ? 92 : 96), x = 128+Math.cos(a)*d, y = 128+Math.sin(a)*d*.92;
    const len = willow ? 36+r()*26 : 24+r()*18, wid = willow ? 4+r()*3 : 9+r()*7;
    const rot = willow ? Math.PI/2 + (r()-.5)*.7 : r()*6.283;
    const tone = clamp(165 + r()*70 + (128-y)*.32 + (128-x)*.12, 90, 255)|0;
    g.fillStyle = `rgb(${tone},${tone},${tone})`;
    g.save(); g.translate(x,y); g.rotate(rot); g.beginPath(); g.moveTo(-len/2,0); g.quadraticCurveTo(0,-wid,len/2,0); g.quadraticCurveTo(0,wid,-len/2,0); g.fill(); g.restore();
  }
  const t = new THREE.CanvasTexture(c); return t;
}
function woolTexture(){
  const c = canvas(128,128), g = c.getContext('2d'), r = rng(11);
  for(let i=0;i<30;i++){
    const a = r()*6.283, d = Math.pow(r(),.6)*38, x = 64+Math.cos(a)*d, y = 64+Math.sin(a)*d;
    const tone = clamp(232 + r()*22 - (y-64)*.5 - (x-64)*.2, 160, 255)|0;
    g.fillStyle = `rgb(${tone},${tone-3},${tone-10})`; g.beginPath(); g.arc(x,y,9+r()*10,0,6.283); g.fill();
  }
  g.lineCap = 'round';
  for(let i=0;i<46;i++){
    const a = r()*6.283, d = Math.sqrt(r())*40, x = 64+Math.cos(a)*d, y = 64+Math.sin(a)*d;
    g.strokeStyle = `rgba(140,128,110,${.25+r()*.3})`; g.lineWidth = 1.6+r();
    g.beginPath(); g.arc(x,y,3+r()*4,r()*6,r()*6+3.5); g.stroke();
  }
  return new THREE.CanvasTexture(c);
}

function cardGeometry(cards){

  for(let i=0;i<8;i++){ const a = i/8*6.283+.39; mesh(CONE, hedge, GARDEN[0]+Math.cos(a)*10.5, 1.1, GARDEN[1]+Math.sin(a)*10.5, .7, 2.2, .7); }

  }
  [[-38,-18,21,6.5,'oak'],[-44,8,19,6,'lime'],[-34,-38,23,7,'oak'],[-12,-41,22,7,'lime'],[10,-42,20,6.5,'oak'],[30,-34,22,7,'oak'],[38,-14,18,6,'lime'],[-56,-14,20,6.5,'oak'],[-40,32,15,5.2,'lime'],[-52,22,17,5.5,'oak'],[50,-38,21,6.5,'oak'],[-20,-56,24,7.5,'oak'],[18,-58,23,7,'lime']]
    .forEach(([lx,lz,h,R,p]) => { const [x,z] = toWorld(lx,lz); T.push([x,z,h,R,p,true]); });
  [[-62,-160,15,5,'oak'],[-34,-150,12,4.5,'lime'],[44,-150,13,4.6,'oak'],[-84,-200,20,6.5,'oak'],[76,-205,21,6.5,'oak']].forEach(t => T.push(t));

    const m = new THREE.Mesh(cardGeometry(crown(r, {cx:0, cy:4.1, cz:0, rx:2.3, ry:1.7, rz:2.3, n:70, s:1.5, pal:PAL.willow})), MAT.willow);

function buildCastle(){

  const g = new THREE.Group(); g.position.set(CX, WY, CZ); g.rotation.y = ROT; scene.add(g);

    rows(c,H,cols);

  }, seed);

  // stair tower: brick shaft with white bands, a white cornice, then the dark bell, open lantern, pear and needle
  const T = new THREE.Group(); T.position.set(HW/2+.6, 0, -HD/2-.4); T.rotation.y = -Math.PI/8; g.add(T);
  const TR = 1.8, TH = 16.6, per = 8*2*TR*Math.sin(Math.PI/8);

  document.getElementById('loading').hidden = true;
  restore();
  if(!store.get('markdal-seen') && !mineSheep().length) startDemo();
  ready = true;
  renderer.setAnimationLoop(frame);
}, 30));
})();
